
on:
  workflow_dispatch:
    inputs:
      publish_pypi:
        description: "Publish the package on PyPI"
        required: true
        default: false
        type: boolean

jobs:
  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [
          ubuntu-latest, ubuntu-24.04-arm,
          windows-latest, windows-11-arm,
          macos-15-intel, macos-latest
        ]

    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false

      # Used to host cibuildwheel
      - uses: actions/setup-python@v6

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==4.2.0

      - name: Build wheels
        run: python -m cibuildwheel --output-dir wheelhouse

      - uses: actions/upload-artifact@v6
        with:
          name: cibw-wheels-${{ matrix.os }}-${{ strategy.job-index }}
          path: ./wheelhouse/*.whl
  
  build_sdist:
    name: Build source distribution
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      
      - name: Build sdist
        run: pipx run build --sdist
      
      - uses: actions/upload-artifact@v6
        with:
          name: cibw-sdist
          path: dist/*.tar.gz
  
  publish-to-pypi:
    name: Publish distribution to PyPI
    if: ${{ inputs.run_optional_job }}
    needs:
      - build_wheels
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/zbic
    permissions:
      id-token: write
    steps:
      - name: Download all dists
        uses: actions/download-artifact@v8
        with:
          pattern: cibw-*
          merge-multiple: true
          path: dist/
      
      - name: Publish distribution to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
